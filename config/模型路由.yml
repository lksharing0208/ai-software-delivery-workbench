# 本文件是团队或个人的模型分工约定，不会自动路由请求，也不会读取或控制各平台的剩余额度。
# 如果未来接入模型编排器，应另行实现权限、超时、重试、成本统计和审计机制。

版本: "1.0"
默认语言: "简体中文"

总原则:
  唯一正式代码源: "GitHub"
  主代码执行者: "Codex 桌面端 + DeepSeek"
  同一工作区同时修改者数量: 1
  生产部署默认需要人工批准: true
  网页模型默认职责: "需求分析、独立审查、外部资料核查，不直接修改本地工作区"

模型职责:
  Codex_DeepSeek:
    职责: "主执行者；读取本地项目、修改代码、运行测试、修复缺陷、重构、构建和部署准备"
    允许修改本地文件: true
    主要适用任务: ["功能开发", "缺陷修复", "测试补充", "重构实施", "构建验证"]
  ChatGPT_网页端:
    职责: "需求澄清、架构评估、复杂故障分析、业务逻辑和安全边界复核"
    允许修改本地文件: false
    主要适用任务: ["需求设计", "方案比较", "调用链分析", "高风险变更复核"]
  Claude_网页端:
    职责: "独立代码审查；重点寻找跨模块副作用、边界条件、并发、资源释放和兼容性风险"
    允许修改本地文件: false
    主要适用任务: ["关键变更审查", "重构风险审查", "独立缺陷查找"]
  Gemini_网页端:
    职责: "大范围代码理解、模块关系梳理、遗漏场景和测试用例补充"
    允许修改本地文件: false
    主要适用任务: ["跨文件理解", "测试设计", "替代方案补充"]
  Grok_网页端:
    职责: "核查最新外部技术信息、依赖版本变化、发布公告和可引用来源"
    允许修改本地文件: false
    主要适用任务: ["版本核对", "技术资料检索", "外部事实核实"]

免费网页额度工作量建议:
  # 百分比表示规划时的相对关注度，不是平台实际消息配额或实际消耗比例。
  ChatGPT: 35
  Claude: 35
  Gemini: 20
  Grok: 10

付费编码额度规划:
  # 按可用月度预算的目标占比规划，按真实账单与任务复杂度调整。
  常规编码与功能实现: 55
  复杂缺陷排查与重构: 25
  疑难验证与测试修复: 15
  预留: 5

任务升级规则:
  普通低风险变更:
    步骤: ["Codex + DeepSeek 实现", "本地测试", "一个网页模型审查", "PR 合并"]
  高风险变更:
    适用条件: ["支付", "鉴权", "并发", "数据库迁移", "敏感数据", "生产部署", "核心架构重构"]
    步骤: ["ChatGPT 澄清要求", "Codex + DeepSeek 实现", "Claude 独立审查", "ChatGPT 或 Gemini 交叉验证", "自动化测试", "人工批准"]
  外部时效信息:
    步骤: ["Grok 或网页搜索核验官方来源", "记录来源与检索日期", "再交给主执行者实施"]

审查等级:
  P0: "严重安全漏洞、重大数据丢失或生产整体不可用；立即阻断发布"
  P1: "核心业务错误、关键流程失效或严重一致性风险；修复后才能合并/发布"
  P2: "边界、性能、兼容性或维护性风险；评估后修复或登记"
  P3: "非功能建议或纯风格意见；默认不阻断交付"
